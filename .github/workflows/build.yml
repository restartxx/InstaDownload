name: Build & Release

on:
  push:
    branches: [ main, master, stories ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x InstaDownload/gradlew

      - name: Build Debug APK
        working-directory: InstaDownload
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaDownload-${{ github.ref_name }}-debug
          path: InstaDownload/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: InstaDownload/app/build/outputs/apk/debug/app-debug.apk
          name: InstaDownload ${{ github.ref_name }}
          generate_release_notes: true
