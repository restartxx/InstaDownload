name: Build All APKs (Debug)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APKs
        working-directory: InstaDownload
        run: ./gradlew assembleDebug

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InstaDownload-APKs
          path: InstaDownload/app/build/outputs/apk/**/*.apk
          retention-days: 30
